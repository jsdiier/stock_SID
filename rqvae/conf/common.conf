[data]
# 训练数据日期范围（存量训练：近3年）
start_date = 20230606
end_date   = 20260606

# tushare token
tushare_token = ma122c996ccaac10157d709313800051983

# 量价指标（顺序固定，不可更改）
indicators = open,high,low,close,vol,amount,pct_chg

# 每周必须恰好有 5 个交易日，否则丢弃
min_days_per_week = 5

# embedding 维度 = min_days_per_week × len(indicators)
input_dim = 35

# API 请求间隔（秒）
api_sleep = 0.3

[training]
# 训练模式：
#   full        → 存量，从头训练全量数据（清空 checkpoint）
#   incremental → 增量，在最新 checkpoint 上继续训练新数据
mode = full

batch_size   = 512
epochs       = 100
learning_rate = 1e-3
weight_decay  = 1e-5

# 设备：cuda / cpu（检测不到 cuda 时自动降级）
device = cuda

# 学习率调度：cosine annealing with warmup
lr_scheduler   = cosine
warmup_epochs  = 5

# checkpoint 策略
save_every_n_epochs     = 10
keep_last_n_checkpoints = 3

# 梯度裁剪
grad_clip = 1.0

[rqvae]
# Encoder / Decoder 隐层（输入→latent 方向，逗号分隔）
hidden_dims = 256,128,64

# latent space 维度（残差量化在此空间操作）
latent_dim = 32

# 残差量化层数 K（每个样本生成 K 个码字，拼成 SID）
num_codebooks = 3

# 每个 codebook 的码字数
codebook_size = 128

# EMA 衰减系数（codebook 更新，不走梯度）
ema_decay = 0.99

# commitment loss 权重（防止 encoder 输出偏离 codebook）
commitment_weight = 0.1

[paths]
# 预处理输出目录（处理好的 embedding 存放位置）
raw_data_dir   = D:/stock/stock_sid/data/raw
embedding_dir  = D:/stock/stock_sid/data/embeddings

# 模型 checkpoint 与训练日志
checkpoint_dir = D:/stock/stock_sid/rqvae/checkpoints
log_dir        = D:/stock/stock_sid/rqvae/logs

[wandb]
enabled  = true
api_key  = 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
project  = stock-rqvae
run_name = rqvae-full-3y

[scripts]
# 数据预处理（全量抓取 + 归一化 + 合并）
preprocess = scripts\run_preprocess.bat

# 模型训练
train = scripts\run_train.bat

# 增量更新（先增量预处理，再增量训练）
incremental_preprocess = scripts\run_preprocess.bat --incremental
incremental_train      = scripts\run_train.bat --mode incremental
