[dates]
; Training date range — build sliding-window SID sequences from weeks in this range
train_start = 20230601
train_end   = 20260101

; Test date range — predict for these weeks and compare with ground truth
test_start  = 20260102
test_end    = 20260303

[stocks]
; "all" → use every stock in the SID cache
; or comma-separated ts_codes, e.g.: 000001.SZ,600519.SH,300750.SZ
universe   = all

; max number of stocks to load (0 = unlimited, useful for quick smoke tests)
max_stocks = 0

[sequence]
; Context window fed to the model, in weeks
history_weeks = 52

; Min past weeks required to keep a training sample (avoids cold-start noise)
; set to 1 to keep all; set equal to history_weeks to keep only full windows
min_context_weeks = 4

; Fraction of training weeks (taken from the END of the train range) held out as validation.
; e.g. 0.05 with ~140 train weeks ≈ last 7 weeks → val set.
; Time-based split: validation always comes after all training data.
val_ratio = 0.05

[model]
d_model         = 128
nhead           = 4
num_layers      = 4
dim_feedforward = 512
dropout         = 0.1

[training]
batch_size    = 512
epochs        = 30
learning_rate = 5e-4
weight_decay  = 1e-5
; cuda or cpu — falls back to cpu automatically if cuda is unavailable
device        = cuda
save_every    = 5
grad_clip     = 1.0
warmup_epochs = 2

[paths]
; Source SID data produced by the RQ-VAE pipeline
; Paths are relative to the stock_SID project root
sid_cache  = data/embeddings/sid_cache.npy
train_meta = data/embeddings/train_meta.csv

; SFT output directories (created automatically)
data_dir       = sft/data
checkpoint_dir = sft/checkpoints
log_dir        = sft/logs
result_dir     = sft/results

[rqvae]
; Must match the trained RQ-VAE model
num_codebooks = 3
codebook_size = 128

[wandb]
enabled  = true
api_key  = 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
project  = stock-sid-sft
run_name = qwen3-0.6b-lora

[llm]
; Path to downloaded Qwen3-0.6B (base model weights)
model_dir    = sft/models/qwen3-0.6b
; Where LoRA adapters + tokenizer are saved after training
adapter_dir  = sft/checkpoints/llm

; LoRA
lora_r       = 16
lora_alpha   = 32
lora_dropout = 0.05

; Training
batch_size    = 8
grad_accum    = 4
epochs        = 3
learning_rate = 2e-4
weight_decay  = 1e-4
max_seq_len   = 256
warmup_ratio  = 0.03
; save a mid-epoch checkpoint every N optimizer steps (0 = only save at epoch end)
save_steps    = 500

; compute validation loss every N optimizer steps (0 = only at epoch end)
eval_steps    = 200

[inference]
; beam search width = number of candidate SIDs returned per stock
beam_k       = 5
; stocks per generate() call (lower this if OOM)
batch_size   = 32
; RQ-VAE config (encoder checkpoint + raw/embedding dirs are read from it)
rqvae_config = rqvae/conf/common.conf
; skip stocks whose code starts with any of these prefixes (comma-separated)
; 300,301 = 创业板 ChiNext; add 688 to also skip 科创板 STAR market
exclude_prefixes = 300,301
